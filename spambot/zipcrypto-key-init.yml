rule:
  meta:
    name: initialize ZipCrypto key state
    namespace: data-manipulation/encryption/zipcrypto
    authors:
      - gemesa@protonmail.com
    description: >-
      Detects ZipCrypto key initialization (FUN_0047f7b0) by the three
      PKWARE spec key constants (section 6.1.5).
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
      - Defense Evasion::Obfuscated Files or Information [T1027]
    mbc:
      - Cryptography::Encrypt Data [C0027]
    references:
      - https://pkware.cachefly.net/webdocs/casestudies/APPNOTE.TXT
      - https://www.virustotal.com/gui/file/36684cef31a4a43473d5b12d30aabf94f56e407b0eeec14b7c1cb87efa3159b6
    examples:
      - 88B43801B38ACEA324467ECE3F12A0E0:0x0047F7B0
  features:
    - and:
      - number: 0x12345678 = ZipCrypto key(0) init
      - number: 0x23456789 = ZipCrypto key(1) init
      - number: 0x34567890 = ZipCrypto key(2) init
