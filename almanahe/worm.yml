## Sigma rule 1: thread execution hijacking via suspended browser process.
## Detects T1055.003: Browser spawned by explorer without a URL.

title: Suspicious suspended browser process creation for thread hijacking
id: 4a52869c-6826-445e-8547-130a0f4317ac
status: experimental
description: |
  Detects a browser process spawned by explorer.exe without a URL on the command line.
  The malware reads the default browser from htmlfile\shell\open\command and launches it
  with CREATE_SUSPENDED. Since the browser is started for injection (not user browsing),
  it has no URL argument.
references:
  - https://attack.mitre.org/techniques/T1055/003/
author: gemesa@protonmail.com
date: 2025-02-16
tags:
  - attack.defense-evasion
  - attack.privilege-escalation
  - attack.t1055.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\explorer.exe'
    Image|endswith:
      # Tune this list.
      - '\iexplore.exe'
      - '\firefox.exe'
      - '\chrome.exe'
      - '\msedge.exe'
      - '\opera.exe'
      - '\brave.exe'
  filter_user_browsing:
    CommandLine|contains:
      - "http://"
      - "https://"
      - ".html"
      - ".htm"
  condition: selection and not filter_user_browsing
level: high
falsepositives:
  - Software that opens browsers without a URL.

