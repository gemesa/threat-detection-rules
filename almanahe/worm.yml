## Sigma rule 3: linkinfo.dll loaded from non-system directory.
## Detects the malware DLL being loaded after drop or search-order hijack.

title: linkinfo.dll loaded from non-system directory
id: a8cb10b2-6be2-49f5-a7bc-14149573f4e5
status: experimental
description: |
  Detects linkinfo.dll being loaded from outside System32. The shellcode stub drops
  the malware DLL as %TEMP%\linkinfo.dll and loads it via LoadLibraryA. A legitimate
  linkinfo.dll load should always come from System32.
references:
  - https://attack.mitre.org/techniques/T1055/004/
  - https://attack.mitre.org/techniques/T1574/001/
author: gemesa@protonmail.com
date: 2025-02-16
tags:
  - attack.defense-evasion
  - attack.persistence
  - attack.t1055.004
  - attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    # https://github.com/trustedsec/SysmonCommunityGuide/blob/master/Build/Sysmon.md#image-loading
    ImageLoaded|endswith: '\linkinfo.dll'
  filter_legitimate:
    ImageLoaded|contains:
      - '\Windows\System32\linkinfo.dll'
      - '\Windows\SysWOW64\linkinfo.dll'
  condition: selection and not filter_legitimate
level: critical
falsepositives:
  - Very unlikely. linkinfo.dll should only exist in System32/SysWOW64.

