## Sigma rule 2: APC injection into explorer.exe.
## Detects T1055.004: Any non-standard process opening explorer with full access.

title: Suspicious full access to explorer.exe by non-standard process
id: 4aca5732-fe84-42bb-aee4-94baaf731004
status: experimental
description: |
  Detects any process opening explorer.exe with PROCESS_ALL_ACCESS
  permissions. The APC injection path is triggered from an infected
  EXE (which could be any process name), so this rule does not filter by source image.
  Instead it flags any non-OS process requesting full access to explorer.
references:
  - https://attack.mitre.org/techniques/T1055/004/
author: gemesa@protonmail.com
date: 2025-02-16
tags:
  - attack.defense-evasion
  - attack.privilege-escalation
  - attack.t1055.004
logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith: '\explorer.exe'
    GrantedAccess|contains:
      # https://learn.microsoft.com/en-us/windows/win32/procthread/process-security-and-access-rights
      - "0x1F0FFF" # PROCESS_ALL_ACCESS (pre-Vista)
      - "0x1FFFFF" # PROCESS_ALL_ACCESS (Vista+)
  filter_os_processes:
    SourceImage|endswith:
      # Tune this list.
      - '\csrss.exe'
      - '\lsass.exe'
      - '\winlogon.exe'
      - '\dwm.exe'
      - '\sihost.exe'
      - '\SearchIndexer.exe'
      - '\ShellExperienceHost.exe'
      - '\RuntimeBroker.exe'
  filter_security_tools:
    SourceImage|endswith:
      # Tune this list.
      - '\MsMpEng.exe'
      - '\taskmgr.exe'
      - '\procexp.exe'
      - '\procexp64.exe'
  condition: selection and not 1 of filter_*
level: high
falsepositives:
  - Unknown. Tune based on environment.

