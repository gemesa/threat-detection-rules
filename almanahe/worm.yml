## Sigma rule 4: SeDebugPrivilege escalation by non-standard process.
## Detects the privilege escalation step before the APC injection.

title: SeDebugPrivilege enabled by non-standard process
id: 08366b73-1242-450f-966b-f5703e67ceb9
status: experimental
description: |
  Detects a process enabling SeDebugPrivilege via AdjustTokenPrivileges. This is a
  prerequisite for the APC injection. The malware needs it to call
  OpenProcess(PROCESS_ALL_ACCESS) on explorer.exe. Since the source process is an
  infected EXE (any name), this rule flags any non-standard process enabling this
  privilege.
references:
  - https://attack.mitre.org/techniques/T1055/004/
author: gemesa@protonmail.com
date: 2025-02-16
tags:
  - attack.privilege-escalation
  - attack.t1055.004
logsource:
  product: windows
  service: security
detection:
  selection:
    # https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4703
    EventID: 4703
    EnabledPrivilegeList|contains: "SeDebugPrivilege"
  filter_known_legitimate:
    ProcessName|endswith:
      # Tune this list.
      - '\taskmgr.exe'
      - '\procexp.exe'
      - '\procexp64.exe'
      - '\procmon.exe'
      - '\procmon64.exe'
      - '\MsMpEng.exe'
      - '\csrss.exe'
      - '\windbg.exe'
      - '\x64dbg.exe'
      - '\devenv.exe'
      - '\msvsmon.exe'
      - '\WerFault.exe'
  condition: selection and not filter_known_legitimate
level: medium
falsepositives:
  - Debuggers and RE tools.
  - Security/EDR products.
